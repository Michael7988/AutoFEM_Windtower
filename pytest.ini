[pytest]
testpaths = tests
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    cleanup_archives
    node_modules
    dist
    storage
    ABAQUSwork
markers =
    unit: fast pure-function and contract tests
    numerical: mesh, INP, and report generation tests
    integration: end-to-end local file workflows
    llm: requires a live language-model service
    abaqus: requires the local Abaqus installation
