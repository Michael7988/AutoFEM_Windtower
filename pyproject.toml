[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windtower-autofem"
version = "1.0.0"
description = "LLM-assisted deterministic finite-element modeling for parameterized wind towers"
requires-python = ">=3.8,<3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "requests>=2.31.0",
  "xlrd>=2.0.1",
  "openpyxl>=3.0.7",
  "gmsh>=4.13.0",
  "eval-type-backport>=0.4.0",
  "pyvista>=0.44.0",
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "PyYAML>=6.0.0",
  "Pillow>=10.0.0",
  "trame>=3.0.0",
  "trame-server==3.2.3",
  "trame-vtk>=2.8.0",
  "trame-vuetify>=2.7.0",
]

[project.optional-dependencies]
quality = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.10,<2",
  "pre-commit>=3.5,<4",
  "pytest>=7.4,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: fast pure-function and contract tests",
  "numerical: mesh, INP, and report generation tests",
  "integration: end-to-end local file workflows",
  "llm: requires a live language-model service",
  "abaqus: requires a local Abaqus installation",
]
norecursedirs = [
  ".git", ".pytest_cache", "__pycache__", "cleanup_archives", "node_modules",
  "dist", "storage", "ABAQUSwork",
]

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [
  "core/windtower_backend/storage",
  "tests/fixtures/generated",
  "experiments/legacy",
  "research/tools",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]
files = [
  "core/windtower_backend/parameter_ir.py",
  "core/windtower_backend/services",
  "core/windtower_backend/api",
  "core/windtower_backend/input_batches",
  "core/windtower_backend/reference_models.py",
  "core/windtower_backend/model_library.py",
  "core/windtower_backend/core/pipeline.py",
  "core/windtower_backend/benchmark/native_solver_adapter.py",
  "core/windtower_backend/benchmark/trusted_fem_campaign_v2.py",
  "core/windtower_backend/benchmark/r1_blind.py",
  "core/windtower_backend/benchmark/r1_model_packages.py",
  "core/windtower_backend/benchmark/b1_direct_baseline.py",
  "core/windtower_backend/benchmark/experiment_budget.py",
  "core/windtower_backend/benchmark/hybrid_paper_experiment.py",
  "core/windtower_backend/automation/run_trusted_fem_experiment.py",
  "core/windtower_backend/automation/run_paper_experiment.py",
  "core/windtower_backend/automation/run_case_study.py",
  "core/windtower_backend/benchmark/case_study_application.py",
  "core/windtower_backend/runtime_bootstrap.py",
  "sitecustomize.py",
]

[tool.coverage.run]
source = ["core/windtower_backend"]
omit = [
  "core/windtower_backend/storage/*",
  "core/windtower_backend/local_flange/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 40

[tool.setuptools.packages.find]
where = ["core"]
include = ["windtower_backend*"]
