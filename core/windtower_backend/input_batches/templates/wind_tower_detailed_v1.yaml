schema_version: engineering_model_template_v1
template_id: wind_tower_detailed_v1
version: 1.0.0
model_family: wind_tower
profile_role: extraction_ui_profile
engineering_template_id: wind_tower_shell_door_v1
selectable: true
display_name: 风塔精细模型
description: 适合需要门洞局部细化、更多网格控制和分析输出设置的风塔模型。
fidelity: detailed
adapter: wind_tower_s4r
system_settings:
  element_type: S4R
  section_type: Shell Section
  unit_system: mm-N-MPa-tonne-s
prompt_instructions: >-
  提取精细钢制风塔壳模型所需的完整塔筒分段、门洞及圆角、材料、局部网格过渡、
  载荷、分析类型、模态阶数、边界条件和输出设置。建模目标是有效用户证据。
  对缺失字段可以给出保守的工程建议，但必须使用 source_kind=llm_suggested，
  写明 assumption_basis，且不得伪造文件证据。
parameters:
  - {key: geometry.tower_sections, label: 塔筒精细分段, group: geometry, display_tier: primary, type: collection, unit: mm, suggestible: true, preview_required: true}
  - {key: geometry.door.enabled, label: 是否包含门洞, group: geometry, display_tier: primary, type: boolean, suggestible: true}
  - {key: geometry.door.width_mm, label: 门洞宽度, group: geometry, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: geometry.door.height_mm, label: 门洞高度, group: geometry, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: geometry.door.bottom_z_mm, label: 门洞底标高, group: geometry, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: geometry.door.theta_center_deg, label: 门洞方向, group: geometry, display_tier: primary, type: number, unit: deg, suggestible: true}
  - {key: geometry.door.corner_radius_mm, label: 门洞圆角, group: geometry, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: geometry.door.reinforcement_enabled, label: 门洞加强圈, group: geometry, display_tier: primary, type: boolean, suggestible: true}
  - {key: geometry.door.outer_width_mm, label: 加强圈外宽, group: geometry, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: geometry.door.outer_height_mm, label: 加强圈外高, group: geometry, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: geometry.door.frame_thickness_mm, label: 加强圈厚度, group: geometry, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: geometry.door.reinforcement_material, label: 加强圈材料, group: geometry, display_tier: primary, type: string, suggestible: true}
  - {key: material.name, label: 材料名称, group: material, display_tier: primary, type: string, suggestible: true}
  - {key: material.elastic_modulus_mpa, label: 弹性模量, group: material, display_tier: primary, type: number, unit: MPa, suggestible: true}
  - {key: material.poisson_ratio, label: 泊松比, group: material, display_tier: primary, type: number, suggestible: true}
  - {key: material.density, label: 密度, group: material, display_tier: primary, type: number, unit: tonne/mm3, suggestible: true}
  - {key: material.yield_strength_mpa, label: 屈服强度, group: material, display_tier: primary, type: number, unit: MPa, suggestible: true}
  - {key: mesh.global_size_mm, label: 整体网格尺寸, group: mesh, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: mesh.door_size_mm, label: 门洞局部网格, group: mesh, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: mesh.patch_margin_u_mm, label: 门洞环向过渡范围, group: mesh, display_tier: secondary, type: number, unit: mm, suggestible: true}
  - {key: mesh.patch_margin_z_mm, label: 门洞高度向过渡范围, group: mesh, display_tier: secondary, type: number, unit: mm, suggestible: true}
  - {key: mesh.hole_layers, label: 门洞细化层数, group: mesh, display_tier: secondary, type: integer, suggestible: true}
  - {key: loads.top_mass_tonne, label: 顶部质量, group: loads, display_tier: primary, type: number, unit: tonne, suggestible: true}
  - {key: loads.top_horizontal_force_n, label: 顶部水平力, group: loads, display_tier: primary, type: number, unit: N, suggestible: true}
  - {key: loads.top_force_direction, label: 水平力方向, group: loads, display_tier: primary, type: string, suggestible: true}
  - {key: loads.wind_pressure_mpa, label: 风压, group: loads, display_tier: primary, type: number, unit: MPa, suggestible: true}
  - {key: loads.wind_direction_vector, label: 风向矢量, group: loads, display_tier: primary, type: collection, suggestible: true}
  - {key: loads.wind_pressure_profile, label: 分段风压, group: loads, display_tier: primary, type: collection, unit: MPa, suggestible: true}
  - {key: loads.top_force_parallel_n, label: 顺风向顶部力, group: loads, display_tier: primary, type: number, unit: N, suggestible: true}
  - {key: loads.top_force_transverse_n, label: 横风向顶部力, group: loads, display_tier: primary, type: number, unit: N, suggestible: true}
  - {key: loads.top_force_vertical_n, label: 顶部竖向力, group: loads, display_tier: primary, type: number, unit: N, suggestible: true}
  - {key: loads.top_moment_roll_nmm, label: 局部滚转矩, group: loads, display_tier: primary, type: number, unit: Nmm, suggestible: true}
  - {key: loads.top_moment_pitch_nmm, label: 局部俯仰矩, group: loads, display_tier: primary, type: number, unit: Nmm, suggestible: true}
  - {key: loads.top_moment_yaw_nmm, label: 偏航矩, group: loads, display_tier: primary, type: number, unit: Nmm, suggestible: true}
  - {key: loads.hub_vertical_offset_mm, label: 轮毂竖向力臂, group: loads, display_tier: primary, type: number, unit: mm, suggestible: true}
  - {key: analysis.static_enabled, label: 静力分析, group: analysis, display_tier: primary, type: boolean, suggestible: true}
  - {key: analysis.modal_enabled, label: 模态分析, group: analysis, display_tier: primary, type: boolean, suggestible: true}
  - {key: analysis.modal_modes, label: 模态阶数, group: analysis, display_tier: primary, type: integer, suggestible: true}
  - {key: boundary.name, label: 底部边界条件, group: analysis, display_tier: primary, type: string, suggestible: true}
  - {key: analysis.output_fields, label: 输出变量, group: analysis, display_tier: secondary, type: string, suggestible: true}
